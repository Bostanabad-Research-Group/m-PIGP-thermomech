name: thermomech
channels:
  - pytorch
  - nvidia
  - dglteam/label/th24_cu121
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # numpy stays <2: dgl 2.4 and pypardiso are built against 1.x
  - numpy=1.26
  - scipy
  - pandas
  - matplotlib
  - h5py
  - netcdf4
  - scikit-learn
  - sympy
  - einops
  - tqdm
  - loguru
  - tabulate
  - dill

  # torch stack, CUDA 12.1 (fixed by the dgl label)
  - pytorch=2.4.1
  - pytorch-cuda=12.1
  - torchvision=0.19.1
  - torchaudio=2.4.1
  - dgl=2.4.0.th24.cu121
  - cupy=13.*

  # linear algebra / solvers
  - pypardiso
  - pyamg

  # mesh + viz
  - meshio
  - pyvista
  - vtk>=9.3
  - shapely

  - ipykernel
  - tensorboard

  - pip:
      - gpytorch==1.12
      - botorch==0.11.3
      - linear-operator==0.5.2
      - pyro-ppl==1.9.1
      - jaxtyping==0.2.19
      - typeguard==2.13.3
      - torch-fem==0.6.2
      - torch-sla==0.2.1
      - nvmath-python[cu12]==0.7.0
      - timm==0.6.7
      - memory-profiler
